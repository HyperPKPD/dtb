[package]
name = "dtb"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "dtb: the computation engine behind the nlmx apps Prep Studio, Trial Simulator and BE & DDI Studio (data preparation, trial simulation, bioequivalence, drug interactions, impairment)."
license = "UNLICENSED"
publish = false
build = "build.rs"
default-run = "dtb"

[lib]
name = "dtb"
path = "src/lib.rs"

[[bin]]
name = "dtb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
